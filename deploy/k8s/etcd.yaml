# Kubernetes manifests describe the state you want, and Kubernetes keeps the cluster in that state. Apply with:
#   kubectl apply -f deploy/k8s
# This file runs etcd (a small key-value store). The idservers use it to claim unique worker ids.
# A single replica with no saved data, so it is not highly available.

# ---- Part 1: the Deployment, which keeps the etcd pod running ----
# Which API group and version this kind of object belongs to.
apiVersion: apps/v1
# A Deployment keeps a set of identical pods running and replaces any that die.
kind: Deployment
metadata:
  # The name of this Deployment.
  name: etcd
spec:
  # How many copies (pods) to run. One, to keep it simple; with more replicas etcd would need clustering flags.
  replicas: 1
  # How the Deployment finds the pods it owns: pods carrying the label app=etcd.
  selector:
    matchLabels: {app: etcd}
  # The blueprint used to create each pod.
  template:
    metadata:
      # Label put on every pod. It must match the selector above.
      labels: {app: etcd}
    spec:
      # The containers in the pod. We only need one.
      containers:
        - name: etcd
          # The image to run, pulled from a registry.
          image: quay.io/coreos/etcd:v3.5.17
          # The command and flags to run inside the container.
          command:
            - etcd
            # Accept client connections on all interfaces, port 2379.
            - --listen-client-urls=http://0.0.0.0:2379
            # The address clients are told to use. "etcd" is the Service name below, which Kubernetes DNS resolves to this pod.
            - --advertise-client-urls=http://etcd:2379
          ports:
            # Documents that the container listens on 2379.
            - containerPort: 2379
# Separates the two objects in this one file.
---
# ---- Part 2: the Service, a stable name and address for the etcd pod ----
# Pod IPs change when pods restart, so other pods use the Service name instead.
apiVersion: v1
kind: Service
metadata:
  # Becomes the DNS name "etcd". The idservers connect to etcd:2379.
  name: etcd
spec:
  # Send traffic to pods labelled app=etcd.
  selector: {app: etcd}
  ports:
    # The Service listens on 2379 and forwards to the pod's port 2379 (same number, so targetPort is not needed).
    - port: 2379
